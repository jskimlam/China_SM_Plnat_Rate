name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean build APK with Android Gradle Plugin
        working-directory: android-app
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Verify alignment and APK Signature Scheme v2+
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verify.txt

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/China-SM-Intelligence.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: China-SM-Intelligence-APK
          path: apk/China-SM-Intelligence.apk

      - name: Publish APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/China-SM-Intelligence.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build verified China SM Intelligence APK"
            git push
          fi
